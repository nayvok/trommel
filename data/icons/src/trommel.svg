<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Trommel — Adwaita</title>
<desc id="desc">Front-facing teal screening drum, four broad screen bars and one gold nugget. Two mirrored supports have equal width and a shared baseline. Soft shadows stay inside the drum or on the supports. No backplate.</desc>
<defs>
  <clipPath id="opening"><circle cx="64" cy="58" r="34"/></clipPath>
  <clipPath id="supports"><path d="M26 82H38L36 110H20Z"/><path d="M26 82H38L36 110H20Z" transform="translate(128 0) scale(-1 1)"/></clipPath>
  <linearGradient id="rim" x1="0" y1="12" x2="0" y2="104" gradientUnits="userSpaceOnUse"><stop stop-color="#09a5af"/><stop offset="1" stop-color="#008896"/></linearGradient>
  <linearGradient id="cavity" x1="0" y1="24" x2="0" y2="92" gradientUnits="userSpaceOnUse"><stop stop-color="#103e47"/><stop offset="1" stop-color="#184b52"/></linearGradient>
  <linearGradient id="stand" x1="0" y1="82" x2="0" y2="110" gradientUnits="userSpaceOnUse"><stop stop-color="#3d5669"/><stop offset="1" stop-color="#3d5669"/></linearGradient>
  <filter id="softContact" x="-.12" y="-.12" width="1.24" height="1.24" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation=".65"/></filter>
  <filter id="softGold" x="-.15" y="-.2" width="1.3" height="1.4" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation=".8"/></filter>
  <filter id="softScreen" x="-.1" y="-.1" width="1.2" height="1.2" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation=".45"/></filter>
</defs>
<!-- Artwork is scaled 1.15x around (64,64); its visible edges are about x11..117, y6..122. -->
<g transform="translate(64 64) scale(1.15) translate(-64 -64) translate(0 2)">
  <g fill="url(#stand)"><path d="M26 82H38L36 110H20Z"/><path d="M26 82H38L36 110H20Z" transform="translate(128 0) scale(-1 1)"/></g>
  <g fill="#304757"><path d="M20 110H36V111Q36 112 35 112H21Q20 112 20 111Z"/><path d="M20 110H36V111Q36 112 35 112H21Q20 112 20 111Z" transform="translate(128 0) scale(-1 1)"/></g>
  <!-- The same short contact shadow falls on both supports, never outside them. -->
  <g clip-path="url(#supports)"><circle cx="64" cy="63" r="46" fill="#092831" opacity=".14" filter="url(#softContact)"/></g>
  <circle cx="64" cy="60" r="46" fill="#006b79"/>
  <circle cx="64" cy="58" r="46" fill="url(#rim)"/>
  <circle cx="64" cy="58" r="34" fill="url(#cavity)"/>
  <g clip-path="url(#opening)">
    <path transform="translate(0 1.25)" d="M46 20h7v76h-7Z M75 20h7v76h-7Z M26 42h76v7H26Z M26 72h76v7H26Z" fill="#092831" opacity=".16" filter="url(#softScreen)"/>
    <path d="M46 20h7v76h-7Z M75 20h7v76h-7Z M26 42h76v7H26Z M26 72h76v7H26Z" fill="#b3cbd0"/>
    <path transform="translate(0 1.5)" d="m62 58 16 6 10 18-12 12H54L42 82l6-14Z" fill="#061d25" opacity=".19" filter="url(#softGold)"/>
    <path d="m62 58 16 6 10 18-12 12H54L42 82l6-14Z" fill="#f5b40a"/>
      <path d="m62 58 16 6-10 14-20-10Z" fill="#ffe37c"/>
      <path d="m48 68 20 10-14 16-12-12Z" fill="#ffc52c"/>
      <path d="m78 64 10 18-20-4Z" fill="#f6d32d"/>
      <path d="m68 78 20 4-12 12H54Z" fill="#e49a00"/>
  </g>
  <circle cx="64" cy="58" r="34" fill="none" stroke="#006b79" stroke-width="2"/>
  <path d="M20 58a44 44 0 0 1 88 0" fill="none" stroke="#ffffff" stroke-width="2" opacity=".24"/>
  <path d="M20 58a44 44 0 0 0 88 0" fill="none" stroke="#004f60" stroke-width="2" opacity=".17"/>
</g>
</svg>
