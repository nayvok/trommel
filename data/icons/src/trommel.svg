<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Trommel app icon: a small trommel drum with gold falling into a tray.
       GNOME HIG: 128x128 canvas, 2px grid, simple geometry, no text. -->
  <rect x="4" y="4" width="120" height="120" rx="27" fill="#3584e4"/>

  <!-- support frame -->
  <path d="M28 88 L38 101 H52 L45 88 Z" fill="#865e3c"/>
  <path d="M100 88 L90 101 H76 L83 88 Z" fill="#865e3c"/>
  <rect x="30" y="84" width="68" height="6" rx="3" fill="#63452c"/>

  <!-- drum body -->
  <path d="M30 56 h68 v18 a34 12 0 0 1 -68 0 z" fill="#b5835a"/>
  <ellipse cx="64" cy="56" rx="34" ry="12" fill="#cdab8f"/>
  <ellipse cx="64" cy="56" rx="26" ry="8" fill="#63452c"/>
  <ellipse cx="64" cy="56" rx="26" ry="8" fill="#865e3c" opacity="0.55"/>

  <!-- screen holes -->
  <circle cx="45" cy="70" r="2.2" fill="#3d3846"/>
  <circle cx="55" cy="74" r="2.2" fill="#3d3846"/>
  <circle cx="65" cy="75" r="2.2" fill="#3d3846"/>
  <circle cx="75" cy="74" r="2.2" fill="#3d3846"/>
  <circle cx="85" cy="70" r="2.2" fill="#3d3846"/>

  <!-- gold particles -->
  <circle cx="48" cy="94" r="4" fill="#f6d32d"/>
  <circle cx="62" cy="98" r="3" fill="#f5c211"/>
  <circle cx="76" cy="95" r="2.5" fill="#f6d32d"/>
  <path d="M40 104 h48" stroke="#f6d32d" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
