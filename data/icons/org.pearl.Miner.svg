<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Плоская иконка по гайдлайнам GNOME: без градиентов и теней,
       скругление ~22.5% от стороны, один смысловой объект — жемчужина. -->
  <rect x="4" y="4" width="120" height="120" rx="27" fill="#3584e4"/>
  <!-- жемчужина -->
  <circle cx="64" cy="64" r="33" fill="#ffffff"/>
  <!-- блик -->
  <circle cx="51" cy="50" r="7" fill="#dbe9fb"/>
  <!-- молния хешрейта: вырез в тон фона, по центру жемчужины -->
  <path d="M67 37 L51 66 h 10 L 58 91 L 78 60 H 66 Z" fill="#1a5fb4"/>
</svg>
