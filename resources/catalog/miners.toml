# Built-in miner catalogue. Community contributions add entries here.
#
# `driver` selects the core argument shape (wildrig | generic | srbminer | onezero).
# API and probe fields are data too: adding an integration should not require a
# Rust branch. Fees are per algorithm because miners charge differently.

[[miners]]
id = "wildrig"
name = "WildRig Multi"
short_description_en = "Fast NVIDIA miner with 0% developer fee on PearlHash."
short_description_ru = "Быстрый NVIDIA-майнер с 0% комиссии разработчика на PearlHash."
homepage = "https://github.com/andru-kun/wildrig-multi"
license = "Freeware"
source_url = "https://github.com/andru-kun/wildrig-multi/releases"
supported_algos = ["pearlhash", "kawpow", "nexapow"]
fee_pct = 0.0
fee_configurable = false
fee_flag = ""
per_gpu_stats = true
# `-d/--gpu-list` and `--print-devices` are documented in the upstream README.
per_gpu_devices = true
device_flag = "--gpu-list"
driver = "wildrig"
api_default_port = 4028
api_port_flag = "--api-port"
api_worker_flag = "--api-worker-id"
default_options = { fan_speed = "0" }

[[miners.fees]]
algo = "pearlhash"
pct = 0.0

[[miners.fees]]
algo = "kawpow"
pct = 0.75

[[miners.fees]]
algo = "nexapow"
pct = 0.75

[[miners.versions]]
version = "0.51.8"
channel = "stable"
url = "https://github.com/andru-kun/wildrig-multi/releases/download/0.51.8/wildrig-multi-linux-0.51.8.tar.gz"
sha256 = "43f4071c743c922f2febf4b8ea44fc9f93dff668f5ffafcc24903dfd78f63771"
archive = "tar.gz"
binary = "wildrig-multi"
verified = true
released_at = "2026-10-24"
notes = "Official Linux tarball; 0% fee on PearlHash. Recommended for RTX 30/40/50."

[[miners.versions]]
version = "0.51.5"
channel = "older"
url = "https://github.com/andru-kun/wildrig-multi/releases/download/0.51.5/wildrig-multi-linux-0.51.5.tar.gz"
sha256 = "3980924f6409452aafb7d57c029151c436ea8e9379e414695504adc4c3cde5d0"
archive = "tar.gz"
binary = "wildrig-multi"
verified = true
released_at = "2026-09-01"
notes = "Official Linux tarball; fallback if 0.51.8 is unstable on your card."

[[miners.options]]
key = "fan_speed"
label_en = "Fan speed"
label_ru = "Вентилятор"
help_en = "Passed to the miner; N/A on cards without fan control."
help_ru = "Передаётся майнеру; не работает на картах без управления вентилятором."
kind = "int"
default = "0"
min = 0
max = 100
flag = "--gpu-fan-speed"
scope = "gpu"
advanced = false

[[miners.options]]
key = "intensity"
label_en = "GPU intensity"
label_ru = "Интенсивность GPU"
help_en = "Miner-specific intensity; leave empty for the miner default."
help_ru = "Интенсивность конкретного майнера; пусто — значение по умолчанию."
kind = "int"
default = ""
min = 0
max = 64
flag = "--gpu-intensity"
scope = "gpu"
advanced = true

[[miners]]
id = "srbminer"
name = "SRBMiner-MULTI"
short_description_en = "Multi-algorithm miner; NVIDIA PearlHash kernels since 3.7.3."
short_description_ru = "Мультиалгоритменный майнер; NVIDIA-ядра PearlHash с 3.7.3."
homepage = "https://github.com/doktor83/SRBMiner-Multi"
license = "Freeware"
source_url = "https://github.com/doktor83/SRBMiner-Multi/releases"
supported_algos = ["pearlhash", "kawpow", "autolykos2"]
fee_pct = 0.85
fee_configurable = false
fee_flag = ""
per_gpu_stats = true
# `--gpu-id` selects ids printed by `--list-devices`; comma-separated.
per_gpu_devices = true
device_flag = "--gpu-id"
driver = "srbminer"
api_default_port = 21550
api_port_flag = "--api-port"
api_enable_flag = "--api-enable"
api_worker_flag = "--api-rig-name"
algorithm_probe_arg = "--list-algorithms"
default_options = { fan_speed = "0" }

[[miners.fees]]
algo = "pearlhash"
pct = 0.85

[[miners.fees]]
algo = "kawpow"
pct = 0.85

[[miners.fees]]
algo = "autolykos2"
pct = 1.0

