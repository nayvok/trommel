# Built-in miner catalogue. Community contributions add entries here.
#
# Fee values are for the PearlHash algorithm unless noted. Only set
# `fee_configurable = true` when the miner really accepts a fee flag; the UI
# must never pretend that a fixed fee can be changed.

[[miners]]
id = "wildrig"
name = "WildRig Multi"
short_description_en = "Fast NVIDIA miner with 0% developer fee on PearlHash."
short_description_ru = "Быстрый NVIDIA-майнер с 0% комиссии разработчика на PearlHash."
homepage = "https://github.com/andru-kun/wildrig-multi"
license = "Freeware"
source_url = "https://github.com/andru-kun/wildrig-multi/releases"
supported_coins = ["pearl"]
supported_algos = ["pearlhash"]
fee_pct = 0.0
fee_configurable = false
fee_flag = ""
per_gpu_stats = false
per_gpu_devices = false
default_options = { fan_speed = "0" }

[[miners.versions]]
version = "0.51.8"
channel = "stable"
url = "https://github.com/andru-kun/wildrig-multi/releases"
sha256 = ""
archive = "binary"
binary = "wildrig-multi"
verified = true
released_at = "2026-10-26"
notes = "Recommended for RTX 30/40/50 on PearlHash; 0% fee on this pool."

[[miners.versions]]
