[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.8.2"
edition = "2021"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "signal"] }
zbus = { version = "6", default-features = false, features = ["tokio", "tokio-multithread", "proxy", "service"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
shell-words = "1"
percent-encoding = "2"
flate2 = "1"
tar = "0.4"
zip = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
