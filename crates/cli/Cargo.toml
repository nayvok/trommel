[package]
name = "trommel"
version.workspace = true
edition.workspace = true

[[bin]]
name = "trommel"
path = "src/main.rs"

[features]
default = []
gui = ["dep:gtk", "dep:adw"]

[dependencies]
trommel-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zbus.workspace = true
clap.workspace = true
gtk = { package = "gtk4", version = "0.11", optional = true, features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", optional = true, features = ["v1_9", "gtk_v4_22"] }
