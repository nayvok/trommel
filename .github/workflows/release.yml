name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            desktop-file-utils appstream gettext librsvg2-bin \
            python3 python3-gi gir1.2-glib-2.0 git ca-certificates dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check secrets
        run: ./scripts/check-no-secrets.sh
      - name: Check docs
        run: ./scripts/check-docs.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features trommel/gui -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Root helper
        run: ./scripts/test-oc-helper.sh
      - name: End-to-end
        run: ./scripts/e2e.sh
      - name: Polkit action id
        run: ./scripts/check-polkit.sh
      - name: Validate assets
        run: |
          desktop-file-validate data/io.github.nayvok.Trommel.desktop
          appstreamcli validate --explain data/io.github.nayvok.Trommel.metainfo.xml
      - name: Build release bundle
        run: ./scripts/release-bundle.sh
      - name: Validate package layout
        run: ./scripts/test-deb.sh "dist/release/trommel_$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')_amd64.deb"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Trommel ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/release/*
